[package]
name = "fulgur-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fulgur-preview"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
fulgur-core = { path = "../fulgur-core" }
fulgur-catalog = { path = "../fulgur-catalog" }
fulgur-solve = { path = "../fulgur-solve" }
fulgur-engine = { path = "../fulgur-engine" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
